services:
  pagobli:
    build: .
    ports:
      - "8080:8080"
    environment:
      PAGOBLI_ACCESS_KEY: ${PAGOBLI_ACCESS_KEY:-}
      PAGOBLI_ADMIN_EMAIL: ${PAGOBLI_ADMIN_EMAIL:-}
      PAGOBLI_ADMIN_PASSWORD: ${PAGOBLI_ADMIN_PASSWORD:-}
      PAGOBLI_ADMIN_NAME: ${PAGOBLI_ADMIN_NAME:-Administración}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

    volumes:
      - pagobli-data:/app/data

volumes:
  pagobli-data:
